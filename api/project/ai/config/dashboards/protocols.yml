    service: opensearch_dashboards
    profile:
      data_source: zeek
      primary_fields:
        - source.ip
        - destination.ip
        - zeek.ssh.auth_success
        - zeek.ssh.client
        - zeek.ssh.server
        - zeek.ssh.direction
      field_hints: >-
        SSH dashboard shows Zeek ssh.log data. Use zeek.ssh.auth_success
        to filter by login success/failure. Client and server fields show
        SSH version strings.
      pivot_affordances: {}

