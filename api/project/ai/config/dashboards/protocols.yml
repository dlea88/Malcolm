# Protocol-specific dashboards — discovered from live Malcolm instance

dashboards:

  2cf94cd0-ecab-40a5-95a7-8419f3a39cd9:
    title: DNS
    keywords: [dns, domain, query, resolve, nameserver]
    service: opensearch_dashboards
    profile:
      data_source: zeek
      primary_fields:
        - source.ip
        - destination.ip
        - zeek.dns.query
        - dns.question.name
        - dns.response_code
        - dns.type
      field_hints: >-
        DNS dashboard shows Zeek dns.log data. Use zeek.dns.query or
        dns.question.name for domain lookups, dns.response_code for
        errors, source.ip for client queries.
      pivot_affordances:
        network.community_id:
          target: arkime
          expression_field: communityId
          description: View DNS session in Arkime

  37041ee1-79c0-4684-a436-3173b0e89876:
    title: HTTP
    keywords: [http, web, url, uri, request, response, user-agent]
    service: opensearch_dashboards
    profile:
      data_source: zeek
      primary_fields:
        - source.ip
        - destination.ip
        - url.domain
        - http.request.method
        - http.response.status_code
        - user_agent.original
        - zeek.http.uri
      field_hints: >-
        HTTP dashboard shows Zeek http.log data. Use url.domain for
        sites visited, http.request.method for methods, user_agent.original
        for client identification.
      pivot_affordances:
        network.community_id:
          target: arkime
          expression_field: communityId
          description: View HTTP session in Arkime

  caef3ade-d289-4d05-a511-149f3e97f238:
